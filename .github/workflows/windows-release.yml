name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Source kodni olish
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Python paketlari
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,windows]"

      - name: Testlar
        run: python -m pytest

      - name: Tesseract va 7-Zip tayyorlash
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          New-Item -ItemType Directory -Force packaging/vendor/7zip | Out-Null
          New-Item -ItemType Directory -Force packaging/vendor/tesseract | Out-Null
          Copy-Item "C:\Program Files\7-Zip\7z.exe" packaging/vendor/7zip/
          Copy-Item "C:\Program Files\7-Zip\7z.dll" packaging/vendor/7zip/
          Copy-Item "C:\Program Files\Tesseract-OCR\*" packaging/vendor/tesseract/ -Recurse -Force
          $tessdata = "packaging/vendor/tesseract/tessdata"
          foreach ($language in @("eng", "rus", "uzb", "uzb_cyrl", "osd")) {
            Invoke-WebRequest "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/$language.traineddata" -OutFile "$tessdata/$language.traineddata"
          }

      - name: Windows dasturini yig'ish
        run: pyinstaller --clean --noconfirm packaging/techocr.spec

      - name: Inno Setup o'rnatish
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Setup EXE yaratish
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\techocr.iss'

      - name: Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechOCR-Windows-Setup
          path: dist-installer/TechOCR-Setup.exe
          if-no-files-found: error

      - name: GitHub Release'ga joylash
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/TechOCR-Setup.exe
          generate_release_notes: true
